<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <h1>Register Form</h1>
    <form action="" id="register-form">
      <label for="username">Username:</label><br />
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter username"
        required
      /><br />
      <small id="username-error-msg" style="color: red"></small><br />
      <label for="email">Email:</label><br />
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter email"
        required
      /><br />
      <small id="email-error-msg" style="color: red"></small><br />
      <label for="password">Password:</label><br />
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter password"
        required
      /><br />
      <small id="password-error-msg" style="color: red"></small><br />
      <label for="repassword">Confirm password:</label><br />
      <input
        type="password"
        id="repassword"
        name="repassword"
        placeholder="Confirm password"
        required
      /><br />
      <small id="repassword-error-msg" style="color: red"></small><br /><br />
      <button type="submit" id="submit-btn">Submit</button>
    </form>

    <!-- Script -->
    <script src="handle-form.js"></script>
  </body>
</html>
