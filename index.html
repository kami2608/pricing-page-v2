<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="add-task">
      <h1>Add task</h1>
      <form action="#" onsubmit="return false;" id="add-form">
        <label for="title">Title: </label><br />
        <input type="text" id="title" required /><br />
        <label for="description">Description: </label><br />
        <input type="text" id="description" required /><br /><br />
        <button type="submit" id="submit-btn">Add</button><br />
      </form>
    </div>
    <br />
    <h1>To-Do List</h1>
    <h2>Filter:</h2>
    <section class="search">
      <label>Title: <input type="text" id="title-filter"/></label><br />
      <label>Status: <select name="status" id="status-filter"></select></label><br /><br />
    </section>
    <table class="todo-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Description</th>
          <th>Status</th>
          <th>Created At</th>
          <th>Updated At</th>
          <th>Edit</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="todolist">
        <tr>
          <td>1</td>
          <td>ABC</td>
          <td>des11111</td>
          <td>
            <select name="status" id="status">
              <option value="todo">Todo</option>
              <option value="progress">Progress</option>
              <option value="done">Done</option>
            </select>
          </td>
          <td>10/12/25</td>
          <td>11/12/25</td>
          <td><button onclick="console.log(1)">Edit</button></td>
          <td><button onclick="console.log(2)">Delete</button></td>
        </tr>
      </tbody>
    </table>

    <!-- Script -->
    <script src="main.js"></script>
  </body>
</html>
